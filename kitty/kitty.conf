# Font
font_family      Iosevka Nerd Font
bold_font        true
italic_font      auto
bold_italic_font auto
font_size        14.0

# Transparency
background_opacity 0.80

# Colors (Catppuccin Mocha, matching your dmenu setup)
foreground            #cdd6f4
background            #1e1e2e
selection_foreground  #1e1e2e
selection_background  #f5e0dc
cursor                #f5e0dc

color0  #45475a
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #f5c2e7
color13 #f5c2e7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #a6adc8

# Window padding
window_padding_width 8

# Cursor
cursor_shape beam
cursor_blink_interval 0

# Live reload on save
watch_file_changes yes
